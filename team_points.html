"points":[78339]},{"teamCode":"9GEE7Q","teamName":"Ａｃｕｔｅ　Ｍ・Ｏ・Ｅ　Ｓｙｎｄｒｏｍｅ","points":[76497]},{"teamCode":"ALNV48","teamName":"ねこちゃん","points":[76419]},{"teamCode":"0V270G","teamName":"愚民＜おろ×たみ＞","points":[75781]},{"teamCode":"EVGMFS","teamName":"だんご大家族（っ・ω・）っ　ブーン","points":[75426]},{"teamCode":"UECQ5U","teamName":"かきのたね倶楽部","points":[75299]},{"teamCode":"A2SPZX","teamName":"御形アリシアナ愛好家","points":[74486]},{"teamCode":"R4C959","teamName":"きのこの国","points":[73342]},{"teamCode":"UZT833","teamName":"＊ササクレイション信仰会","points":[73284]},{"teamCode":"RU47T1","teamName":"さばハン","points":[72775]},{"teamCode":"CSXDZ8","teamName":"虹色の数字？なぜ数が変わってるんだ？","points":[72564]},{"teamCode":"XU2MM2","teamName":"あまの誓い","points":[72267]},{"teamCode":"RBDJ3Q","teamName":"Ｔａｐ！　Ｔａｐ！　Ｔａｐ！","points":[72141]},{"teamCode":"WGXFQ3","teamName":"我ら萌え袖チュウニズマー！","points":[71836]},{"teamCode":"TKZAZ4","teamName":"ホワイト企業","points":[71171]},{"teamCode":"157NJ4","teamName":"近畿勢全国勢","points":[71153]},{"teamCode":"L47R1M","teamName":"はらぺこ","points":[70609]},{"teamCode":"JGCSPT","teamName":"アニメ好き","points":[69950]},{"teamCode":"3M821C","teamName":"奏坂学園グラウンドスライダー同好会","points":[69165]},{"teamCode":"LYWVTN","teamName":"ばとーらいつもありがとう","points":[68961]},{"teamCode":"PUYTPU","teamName":"相対性理論","points":[67978]},{"teamCode":"EX67WY","teamName":"フラーレン同素隊","points":[67885]},{"teamCode":"PBES6Y","teamName":"繚乱天華：花吹雪","points":[67665]},{"teamCode":"Q9CTGJ","teamName":"ＫｉＲａＲｅ","points":[67434]},{"teamCode":"DASVEX","teamName":"†","points":[67351]},{"teamCode":"Y2GLQU","teamName":"くらげりうむ","points":[67083]},{"teamCode":"Z3BUXX","teamName":"爆散☆腕破壊軍団","points":[67036]},{"teamCode":"YGDF3W","teamName":"元ドラム勢とユビート勢","points":[66924]},{"teamCode":"X0N2WK","teamName":"竜田揚げより唐揚げ派","points":[66213]},{"teamCode":"AV6235","teamName":"放課後ウニタイム","points":[66172]},{"teamCode":"28W9KH","teamName":"不祥事","points":[65556]},{"teamCode":"F4S0VB","teamName":"フラスコ・オーディション","points":[65406]},{"teamCode":"RBQEP7","teamName":"甘麺二門","points":[65142]},{"teamCode":"7HVM4M","teamName":"笠波羅探題","points":[64838]},{"teamCode":"8ZXHLX","teamName":"せーので！はすのそら！","points":[64394]},{"teamCode":"ZXHRR1","teamName":"ＷＥＬＯＶＥとよた","points":[63747]},{"teamCode":"AM4HTC","teamName":"おねんね","points":[62209]},{"teamCode":"5HV2SF","teamName":"みるくちゃん","points":[61901]},{"teamCode":"08TF2F","teamName":"Ｒａｄｉａｎｔ　Ｊｏｕｒｎｅｙ","points":[61714]},{"teamCode":"GDYTWP","teamName":"Ａｌｏｕｅｔｔｅ　Ｒｅａｌｉｓｅｒ","points":[61229]}]};
    const ctx = document.getElementById('chart').getContext('2d');

    function makeDatasets(selectedCodes) {
      const colors = [];
      // simple color generator
      for (let i=0;i<1000;i++) colors.push('hsl('+((i*37)%360)+',70%,'+ (30 + (i%6)*8) + '%)');

      return data.teams
        .filter(t => selectedCodes.includes(t.teamCode))
        .map((t,i) => ({
          label: t.teamName,
          data: t.points,
          borderColor: colors[i%colors.length],
          backgroundColor: colors[i%colors.length],
          fill: false,
          spanGaps: false,
        }));
    }

    let chart = null;
    function draw(selectedCodes) {
      const datasets = makeDatasets(selectedCodes);
      if (chart) chart.destroy();
      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: data.dates,
          datasets
        },
        options: {
          interaction: {mode:'nearest',axis:'x',intersect:false},
          plugins: {legend:{display:true,position:'bottom'}},
          scales: {
            y: {type:'linear', beginAtZero:false, ticks:{callback: v => v >= 1000000 ? (v/1000000)+'M' : v}}
          }
        }
      });
    }

    function topNLatest(n) {
      // get latest points index
      const lastIdx = data.dates.length - 1;
      const arr = data.teams.map(t => ({code:t.teamCode, name:t.teamName, latest: t.points[lastIdx]}));
      arr.sort((a,b) => (b.latest||0) - (a.latest||0));
      return arr.slice(0,n).map(x => x.code);
    }

    function renderCheckboxes(defaultSelected) {
      const container = document.getElementById('checkboxes');
      container.innerHTML = '';
      data.teams.forEach(t => {
        const id = 'cb_'+t.teamCode;
        const div = document.createElement('span');
        div.className = 'team-checkbox';
        const inp = document.createElement('input');
        inp.type = 'checkbox'; inp.id = id; inp.value = t.teamCode;
        if (defaultSelected.includes(t.teamCode)) inp.checked = true;
        const lab = document.createElement('label');
        lab.htmlFor = id;
        lab.textContent = t.teamName;
        div.appendChild(inp); div.appendChild(lab);
        container.appendChild(div);
      });
    }

    document.getElementById('redraw').addEventListener('click', () => {
      const n = Number(document.getElementById('topN').value) || 20;
      const selected = topNLatest(n);
      renderCheckboxes(selected);
      draw(selected);
    });

    // initial
    const initial = topNLatest(20);
    renderCheckboxes(initial);
    draw(initial);

    // live toggling via checkboxes
    document.getElementById('checkboxes').addEventListener('change', () => {
      const checked = Array.from(document.querySelectorAll('#checkboxes input:checked')).map(i=>i.value);
      draw(checked);
    });
  </script>
</body>
